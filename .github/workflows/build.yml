name: build

# Jeder Job startet auf einem frisch installierten Runner und installiert seine Abhaengigkeiten
# selbst. Damit ist "baut auf frischem System" ein CI-Ergebnis, keine Behauptung.
#
# Matrix der Ziele, die tatsaechlich gebaut werden:
#   Linux   -> Linux-Binary  + Windows-exe (llvm-mingw Cross)
#   macOS   -> macOS-Binary  + Windows-exe (llvm-mingw Cross)
#   Windows -> Windows-exe nativ (MSYS2). Fuer ein Linux-Binary von Windows aus braucht es WSL,
#              das deckt der Linux-Job ab.
on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  linux:
    name: Linux -> Linux + Windows
    # 22.04 statt latest: das Binary soll auch auf aelteren Distributionen laufen.
    # ubuntu-latest bringt eine neuere glibc, dann startet es nur dort.
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: Abhaengigkeiten
        run: bash build/install-deps.sh
      - name: Linux bauen
        run: bash build/build-all.sh linux
      - name: Linux-Binary pruefen
        run: |
          ./build/out/scummvm --version
          echo "--- dynamische Abhaengigkeiten (Allowlist):"
          ldd build/out/scummvm
          BAD=$(ldd build/out/scummvm | awk '{print $1}' | grep -vE '^(linux-vdso|libc|libm|libpthread|libdl|librt|libstdc\+\+|libgcc_s|libz|libpng16|ld-linux)' || true)
          if [ -n "$BAD" ]; then
            echo "FEHLER: unerwartete Laufzeitabhaengigkeit:"; echo "$BAD"; exit 1
          fi
          echo "ok, nur glibc, libstdc++, zlib und libpng16 sind dynamisch"
          echo "--- benoetigte glibc-Symbole (hoechste Version):"
          objdump -T build/out/scummvm | grep -o 'GLIBC_[0-9.]*' | sort -uV | tail -1
      - name: Windows bauen (Cross aus Linux)
        run: bash build/build-all.sh windows
      - name: Windows-Artefakte pruefen
        run: |
          test -f build/out/scummvm.exe
          python3 -c "assert open('build/out/scummvm.exe','rb').read(2)==b'MZ'; print('PE ok')"
      - uses: actions/upload-artifact@v4
        with:
          name: linux-binary
          path: build/out/scummvm
      - uses: actions/upload-artifact@v4
        with:
          name: windows-binary-cross
          path: |
            build/out/scummvm.exe
            build/install/sdl2-mingw/bin/SDL2.dll

  macos:
    name: macOS -> macOS + Windows
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Abhaengigkeiten
        run: bash build/install-deps.sh
      - name: macOS bauen
        run: bash build/build-all.sh macos
      - name: macOS-Binary pruefen
        run: ./build/out/scummvm --version
      - name: Windows bauen (Cross aus macOS)
        id: win
        continue-on-error: true
        run: bash build/build-all.sh windows
      - name: Diagnose Resource-Schritt
        if: steps.win.outcome == 'failure'
        run: |
          cd scummvm/fork/build-windows
          echo "--- WINDRES aus config.mk:"
          grep -E "^WINDRES|^WINDRESFLAGS|^CPPFLAGS" config.mk || true
          echo "--- windres Version:"
          x86_64-w64-mingw32-windres --version || true
          echo "--- llvm-rc Version:"
          "$(dirname "$(command -v x86_64-w64-mingw32-windres)")/llvm-rc" --version || true
          echo "--- make.log Ende:"
          tail -30 make.log || true
          echo "--- Einzelaufruf:"
          make dists/scummvm.o 2>&1 | tail -40 || true
      - name: Windows-Artefakte pruefen
        run: |
          test -f build/out/scummvm.exe
          python3 -c "assert open('build/out/scummvm.exe','rb').read(2)==b'MZ'; print('PE ok')"
      - uses: actions/upload-artifact@v4
        with:
          name: macos-binary
          path: build/out/scummvm
      - uses: actions/upload-artifact@v4
        with:
          name: windows-binary-macos-cross
          path: |
            build/out/scummvm.exe
            build/install/sdl2-mingw/bin/SDL2.dll

  windows-msys2:
    name: Windows (MSYS2) -> Windows
    runs-on: windows-latest
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - uses: actions/checkout@v4
      - uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: false
          path-type: inherit
      - name: Abhaengigkeiten
        run: bash build/install-deps.sh
      - name: Windows bauen (nativ)
        run: bash build/build-all.sh native
      - name: Binary pruefen
        run: ./build/out/scummvm.exe --version
      - uses: actions/upload-artifact@v4
        with:
          name: windows-binary-native
          path: build/out/scummvm.exe
